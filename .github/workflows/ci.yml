name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        # Includes a real (tiny-model) LoRA fine-tune -- downloads a small test model from
        # the HF Hub, so this job needs outbound network access.
        run: uv run pytest --cov=lora_relevance_classifier --cov-report=term-missing
