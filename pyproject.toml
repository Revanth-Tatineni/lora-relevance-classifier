[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lora-relevance-classifier"
version = "0.1.0"
description = "LoRA-fine-tunes a small open model to judge whether a retrieved chunk answers a question -- a learned alternative to rag-qa-api's fixed relevance-gate threshold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Revanth Tatineni" }]
keywords = ["llm", "lora", "peft", "fine-tuning", "classification", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "peft>=0.21.2",
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
lora-relevance-classifier = "lora_relevance_classifier.cli:main"

[project.urls]
Homepage = "https://github.com/Revanth-Tatineni/lora-relevance-classifier"
Repository = "https://github.com/Revanth-Tatineni/lora-relevance-classifier"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_relevance_classifier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/lora_relevance_classifier"]
